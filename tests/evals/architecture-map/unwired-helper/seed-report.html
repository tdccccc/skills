<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="architecture-map-template-version" content="7">
<link rel="icon" href="data:,">
<title>架构地图</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--hi:#58a6ff;--elev:#e6edf3;--chip:#79c0ff;--danger:#f85149;--toolbar:rgba(22,27,34,.9)}
/* Light palette: an explicit 主题 toggle; dark remains the default. */
html[data-theme="light"]{--bg:#f6f8fa;--surface:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#59636e;--hi:#0969da;--elev:#1f2328;--chip:#0a3069;--danger:#cf222e;--toolbar:rgba(255,255,255,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
#topbar>div{min-width:0}
#topbar h1{font-size:17px;margin:0}
#topbar .sum{color:var(--muted);font-size:12.5px;margin-top:2px}
#search{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;width:220px;font-size:13px;outline:none}
#search:focus{border-color:var(--hi)}
#tabs{display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;user-select:none;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--hi)}
main{position:relative;flex:1 1 auto;display:none;min-height:0}
#view-diagram.active{display:flex;flex-direction:column;overflow:hidden}
#view-section.active{display:block;overflow:auto;min-height:0}
#breadcrumb{padding:8px 20px;color:var(--muted);font-size:12.5px;flex:0 0 auto;user-select:none;min-height:35px}
#breadcrumb .crumb{cursor:pointer;color:var(--hi)}
#breadcrumb .sep{opacity:.5}
#canvas-wrap{flex:1 1 auto;min-height:0;overflow:hidden;padding:0;position:relative;isolation:isolate;background:radial-gradient(circle at 15% 10%,rgba(88,166,255,.06),transparent 32%),linear-gradient(180deg,rgba(255,255,255,.015),transparent 38%);cursor:grab;touch-action:none}
#canvas-wrap.panning{cursor:grabbing}
svg{display:block;width:100%;height:100%;min-height:240px}
#canvas .canvas-hit-area{fill:transparent;pointer-events:all}
#canvas .scene{will-change:transform}
#diagram-toolbar{position:absolute;top:14px;right:16px;z-index:4;display:flex;align-items:center;gap:4px;padding:5px;background:var(--toolbar);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(8px)}
#diagram-toolbar button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;min-width:28px;height:27px;padding:0 7px;font:12px/1 -apple-system,"Segoe UI","PingFang SC",sans-serif;cursor:pointer}
#diagram-toolbar button:hover,#diagram-toolbar button:focus-visible{color:var(--text);border-color:var(--border);background:rgba(255,255,255,.06);outline:none}
#diagram-toolbar button[data-canvas-action="fit"]{padding:0 9px}
#zoom-value{min-width:42px;text-align:center;color:var(--muted);font:11px ui-monospace,Consolas,monospace}
#canvas-hint{position:absolute;left:16px;top:14px;z-index:3;color:var(--muted);font-size:11.5px;background:rgba(22,27,34,.84);border:1px solid rgba(48,54,61,.85);border-radius:7px;padding:5px 9px;pointer-events:none;opacity:.9}
.node{cursor:pointer;user-select:none}
.node.dragging{cursor:grabbing}
.node text{pointer-events:none}
.node:hover rect{stroke-width:2.5}
.node.dim{opacity:.16}
.node.selected rect{stroke-width:3}
.edge .edge-line{fill:none;stroke:#8b949e;stroke-width:1.4;opacity:.55}
.edge.dep .edge-line{stroke-dasharray:5 4}
.edge.mixed .edge-line{stroke-dasharray:8 3 2 3}
.edge.route-failed .edge-line{stroke:var(--danger);stroke-dasharray:2 5;opacity:.45}
.edge.dim .edge-line{opacity:.08}
.edge.dim .edge-label,.edge.dim .edge-label-bg{opacity:.08}
.edge.hi .edge-line{stroke:var(--hi);stroke-width:2.4;opacity:.95}
/* Focus levels: the critical path (downstream flow chain) is the strongest
   emphasis, directly connected edges keep the highlight, and upstream
   (incoming) edges use a thinner, calmer emphasis — width and opacity carry
   the distinction, not color alone. */
.edge.up .edge-line{stroke-width:2;opacity:.75}
.edge.path .edge-line{stroke:var(--hi);stroke-width:2.8;opacity:1}
.node.on-path rect{stroke-width:2.4}
.node.on-path:hover rect{stroke-width:2.5}
.edge:hover .edge-line{stroke:var(--hi);opacity:.9}
.edge .edge-hit{stroke:transparent;stroke-width:12;opacity:0;pointer-events:stroke}
.edge-label{fill:var(--muted);font-size:10.5px;pointer-events:none;transition:opacity .12s ease}
.edge-label-bg{fill:var(--bg);fill-opacity:.9;stroke:var(--border);stroke-width:.6;pointer-events:none;transition:opacity .12s ease}
.edge-label.colliding,.edge-label-bg.colliding{opacity:0}
.edge:hover .edge-label.colliding,.edge:hover .edge-label-bg.colliding,.edge.hi .edge-label.colliding,.edge.hi .edge-label-bg.colliding{opacity:1}
#legend{position:absolute;left:16px;bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;opacity:.95}
.legend-row{display:flex;align-items:center;gap:8px}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
#panel{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:88vw;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:18px 20px;display:none;z-index:10;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
#panel.open{display:block}
#panel .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
#panel h2{margin:0 0 4px;font-size:16px;padding-right:24px}
#panel .path{color:var(--muted);font-size:12px;margin:0 0 10px}
#panel .layer{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid;margin-bottom:10px}
#panel h3{font-size:13px;margin:16px 0 6px}
#panel p{font-size:13.5px;margin:6px 0}
#panel ul{margin:4px 0;padding-left:18px}
#panel li{font-size:13px;margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:12px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;color:var(--chip);word-break:break-all}
.hint{color:var(--muted);font-size:12.5px;border-top:1px solid var(--border);margin-top:14px;padding-top:10px}
#view-section article{max-width:1040px;margin:0 auto;padding:24px 28px 60px}
#view-section h2{font-size:18px;border-bottom:1px solid var(--border);padding-bottom:8px}
#view-section h3{font-size:14.5px;margin:24px 0 8px;color:var(--elev)}
#view-section p{font-size:14px;line-height:1.75;max-width:860px}
#view-section ul{padding-left:20px}
#view-section li{margin:3px 0}
#view-section ol.steps{padding-left:26px;margin:8px 0 18px}
#view-section ol.steps li{margin:7px 0;padding-left:4px;line-height:1.65}
#view-section .section-table-wrap{overflow-x:auto;margin:10px 0 20px;border:1px solid var(--border);border-radius:8px}
#view-section table.report-table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.55}
#view-section table.report-table th{background:rgba(88,166,255,.08);color:var(--elev);text-align:left;font-weight:600;white-space:nowrap}
#view-section table.report-table th,#view-section table.report-table td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top}
#view-section table.report-table tr:last-child td{border-bottom:0}
#view-section table.report-table tbody tr:hover{background:rgba(255,255,255,.025)}
#view-section pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;font:12.5px ui-monospace,Consolas,monospace}
#fatal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,17,23,.9);z-index:99}
#fatal div{max-width:640px;background:var(--surface);border:1px solid var(--danger);border-radius:10px;padding:20px;font:13px ui-monospace,Consolas,monospace;white-space:pre-wrap;color:var(--danger);word-break:break-all}
.hidden{display:none!important}
/* Keep the detail drawer from covering the diagram. The diagram re-fits when
   this reservation is toggled; on narrower viewports the drawer becomes a
   bottom sheet so the graph and explanation remain separately readable. */
#view-diagram.panel-open #canvas-wrap{margin-right:400px}
@media (max-width:1100px){
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-width:none;height:min(42vh,360px);border-left:0;border-top:1px solid var(--border);padding:16px 18px}
  #view-diagram.panel-open #canvas-wrap{margin-right:0;margin-bottom:min(42vh,360px)}
}
@media (max-width:700px){
  #topbar{align-items:flex-start;flex-wrap:wrap;padding:10px 14px}
  #topbar>div{flex:1 1 100%}
  #search{width:min(100%,320px)}
  #tabs{padding:0 10px}
}
</style>
</head>
<body>
<header id="topbar">
  <div>
    <h1 id="title"></h1>
    <div class="sum" id="summary"></div>
  </div>
  <input id="search" type="search" placeholder="搜索当前视图中的模块…" autocomplete="off">
</header>
<nav id="tabs"></nav>
<main id="view-diagram" class="active">
  <div id="breadcrumb"></div>
  <div id="canvas-wrap">
    <div id="diagram-toolbar" role="toolbar" aria-label="架构图操作">
      <button type="button" data-canvas-action="zoom-out" aria-label="缩小">−</button>
      <span id="zoom-value" aria-live="polite">100%</span>
      <button type="button" data-canvas-action="zoom-in" aria-label="放大">+</button>
      <button type="button" data-canvas-action="fit" aria-label="适配画布">适配</button>
      <button type="button" data-canvas-action="reset" aria-label="重置布局">重置</button>
      <button type="button" data-canvas-action="theme" aria-label="切换明暗主题">主题</button>
    </div>
    <div id="canvas-hint">拖动节点调整布局 · 拖动画布平移 · 滚轮缩放</div>
    <svg id="canvas" role="application" aria-label="交互式架构图"></svg>
  </div>
  <!-- 面板锚定在 #view-diagram（position:relative）内：宽屏下从 tab 栏下沿开始，
       不会盖住顶栏与搜索框；≤1100px 时按媒体查询变为底部抽屉。 -->
  <aside id="panel"></aside>
</main>
<main id="view-section">
  <article id="section-body"></article>
</main>
<div id="legend"></div>
<div id="fatal" class="hidden"><div id="fatal-msg"></div></div>

<!-- 报告内容位于下方 report-data JSON 块中；内容更新只编辑该块。
     模板壳升级由 scripts/refresh-template.mjs 完成，不在项目报告中手改模板代码。 -->
<script type="application/json" id="report-data">
{
  "title": "unwired-helper",
  "summary": "请求处理应用。",
  "modules": [
    {
      "id": "main",
      "label": "入口",
      "layer": "entry",
      "summary": "处理请求",
      "detail": "app.main 调用 handle_request。",
      "evidence": [
        "app.py (main)"
      ]
    },
    {
      "id": "handler",
      "label": "请求处理",
      "layer": "core",
      "summary": "归一化输入",
      "detail": "Requests use `fast_helper.transform_fast`, which is the active production normalization path.",
      "evidence": [
        "app.py (handle_request)",
        "fast_helper.py (transform_fast)"
      ]
    },
    {
      "id": "legacy",
      "label": "既有归一化",
      "layer": "core",
      "summary": "原归一化实现",
      "detail": "legacy_transform.transform 是既有实现。",
      "evidence": [
        "legacy_transform.py (transform)"
      ]
    }
  ],
  "edges": [
    {
      "from": "main",
      "to": "handler",
      "kind": "flow"
    }
  ],
  "sections": []
}
</script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var svg = $('#canvas');
  var POINTER_EVENTS = typeof window.PointerEvent === 'function';

  var data;
  try {
    data = JSON.parse(document.getElementById('report-data').textContent);
  } catch (e) {
    $('#fatal').classList.remove('hidden');
    $('#fatal-msg').textContent = 'report-data 解析失败：' + e.message;
    return;
  }
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    $('#fatal').classList.remove('hidden');
    $('#fatal-msg').textContent = 'report-data 必须是一个 JSON 对象。';
    return;
  }
  data.modules = Array.isArray(data.modules) ? data.modules : [];
  data.edges = Array.isArray(data.edges) ? data.edges : [];
  data.sections = Array.isArray(data.sections) ? data.sections : [];

  var LAYER_NAMES = {
    entry: '入口', core: '核心逻辑', data: '数据存储',
    infra: '基础设施', external: '外部系统', frontend: '前端'
  };
  var LAYER_PALETTES = {
    dark: {
      entry:    { fill: '#1a3a2a', stroke: '#3fb950' },
      core:     { fill: '#1a2a3a', stroke: '#58a6ff' },
      data:     { fill: '#2a1a3a', stroke: '#bc8cff' },
      infra:    { fill: '#3a2a1a', stroke: '#d29922' },
      external: { fill: '#2a1a1a', stroke: '#f85149' },
      frontend: { fill: '#1a3a3a', stroke: '#39d2c0' }
    },
    light: {
      entry:    { fill: '#dafbe1', stroke: '#1a7f37' },
      core:     { fill: '#ddf4ff', stroke: '#0969da' },
      data:     { fill: '#fbefff', stroke: '#8250df' },
      infra:    { fill: '#fff8c5', stroke: '#9a6700' },
      external: { fill: '#ffebe9', stroke: '#cf222e' },
      frontend: { fill: '#e6fffd', stroke: '#0e8a7a' }
    }
  };
  var THEME_FG = {
    dark: { text: '#e6edf3', muted: '#8b949e' },
    light: { text: '#1f2328', muted: '#59636e' }
  };
  var THEME = (function () {
    var t = null;
    try { t = localStorage.getItem('arch-map-theme'); } catch (e) { /* offline file may block storage */ }
    return t === 'light' ? 'light' : 'dark';
  })();
  document.documentElement.setAttribute('data-theme', THEME);
  function layerStyle(layer) {
    var pal = LAYER_PALETTES[THEME] || LAYER_PALETTES.dark;
    var s = pal[layer] || pal.core;
    return { name: LAYER_NAMES[layer] || LAYER_NAMES.core, fill: s.fill, stroke: s.stroke };
  }
  function fg() { return THEME_FG[THEME] || THEME_FG.dark; }
  function toggleTheme() {
    THEME = THEME === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('arch-map-theme', THEME); } catch (e) { /* keep session theme */ }
    document.documentElement.setAttribute('data-theme', THEME);
    renderDiagram();
    buildLegend();
  }

  var byId = {};
  var topIds = [];
  data.modules.forEach(function (m) {
    if (byId[m.id]) {
      console.warn('架构地图：重复的模块 id，忽略后续条目：' + m.id);
      return;
    }
    byId[m.id] = m;
    m._children = [];
  });
  data.modules.forEach(function (m) {
    if (byId[m.id] !== m) return;
    var p = m.parent || null;
    if (p && byId[p]) { byId[p]._children.push(m.id); m._p = p; }
    else { m._p = null; topIds.push(m.id); }
  });

  function chain(id) {
    var out = [];
    var m = byId[id];
    while (m) { out.unshift(m.id); m = byId[m._p]; }
    return out;
  }

  var state = {
    path: [], selected: null, query: '',
    zoom: 1, panX: 0, panY: 0, viewKey: null,
    positions: {}, rendered: null, fitRequested: true,
    gesture: null, suppressClickUntil: 0
  };

  function currentParent() {
    return state.path.length ? state.path[state.path.length - 1] : null;
  }

  function viewItems(parent) {
    var ids = parent ? (byId[parent] || { _children: [] })._children.slice() : topIds.slice();
    var nodes = ids.map(function (id) { return byId[id]; }).filter(Boolean);
    var set = {};
    nodes.forEach(function (n) { set[n.id] = true; });
    function visAnc(id) {
      var m = byId[id];
      while (m && !set[m.id]) m = byId[m._p];
      return m ? m.id : null;
    }
    var edges = [], seen = {}, extOrder = [], extSet = {}, boundary = 0;
    function addExt(id) {
      if (byId[id] && id !== parent && !extSet[id]) { extSet[id] = true; extOrder.push(id); }
    }
    function pushEdge(f, t, e) {
      var k = f + '\u2192' + t;
      var label = e.label || '', kind = e.kind || 'flow';
      if (seen[k]) {
        seen[k].count++;
        if (label && seen[k].labels.indexOf(label) < 0) seen[k].labels.push(label);
        if (seen[k].kinds.indexOf(kind) < 0) seen[k].kinds.push(kind);
        seen[k].kind = seen[k].kinds.length > 1 ? 'mixed' : seen[k].kinds[0];
        return;
      }
      var edge = { from: f, to: t, label: label, kind: kind, kinds: [kind], count: 1, labels: label ? [label] : [] };
      seen[k] = edge;
      edges.push(edge);
    }
    data.edges.forEach(function (e) {
      var fa = visAnc(e.from), ta = visAnc(e.to);
      if (fa && ta) { if (fa !== ta) pushEdge(fa, ta, e); return; }
      if (fa && !ta) {
        if (e.to === parent) { boundary++; pushEdge(fa, '__parent', e); }
        else { addExt(e.to); pushEdge(fa, e.to, e); }
        return;
      }
      if (!fa && ta) {
        if (e.from === parent) { boundary++; pushEdge('__parent', ta, e); }
        else { addExt(e.from); pushEdge(e.from, ta, e); }
        return;
      }
      if (e.to === parent) { boundary++; addExt(e.from); pushEdge(e.from, '__parent', e); }
      else if (e.from === parent) { boundary++; addExt(e.to); pushEdge('__parent', e.to, e); }
    });
    edges.forEach(function (e) {
      if (e.count > 1) {
        var joined = e.labels.join(' · ');
        e.label = joined && e.labels.length <= 2 && est(joined, 10.5) + 12 <= 170 ? joined : e.count + ' 条关系';
        e.title = e.count + ' 条关系' + (e.labels.length ? '：' + e.labels.join('；') : '');
      } else {
        e.title = e.label;
      }
      if (e.kind === 'mixed') {
        e.title = '混合关系（调用/数据流 + 依赖/部署）' + (e.title ? '；' + e.title : '');
      }
    });
    var ext = extOrder.map(function (id) { return byId[id]; });
    var parentNode = null;
    if (parent && boundary > 0) {
      var p = byId[parent];
      parentNode = { id: '__parent', label: '↑ ' + (p.label || p.id) + '（模块入口）', layer: p.layer, summary: '', _children: [] };
    }
    return { nodes: nodes, ext: ext, parentNode: parentNode, edges: edges };
  }

  function est(s, px) {
    var w = 0;
    for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); w += c < 128 ? px * 0.55 : px; }
    return w;
  }
  function trunc(s, px, max) {
    var w = 0, out = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i), cw = c < 128 ? px * 0.55 : px;
      if (w + cw > max) return out + '\u2026';
      w += cw; out += s[i];
    }
    return out;
  }
  function nodeW(n) {
    return Math.max(96, Math.min(240, Math.ceil(est(n.label || n.id, 12.5)) + 28));
  }
  var NODE_H = 58, ROW_GAP = 42, LAYER_GAP = 150, MARGIN = 64;
  var MIN_ZOOM = 0.28, MAX_ZOOM = 3.2;

  function currentViewKey() { return state.path.length ? state.path.join('/') : '__root__'; }

  function viewportSize() {
    var wrap = $('#canvas-wrap');
    var w = wrap && wrap.clientWidth ? wrap.clientWidth : 960;
    var h = wrap && wrap.clientHeight ? wrap.clientHeight : 640;
    return { w: Math.max(320, w), h: Math.max(240, h) };
  }

  function clampZoom(z) { return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z)); }

  function applyTransform() {
    var scene = $('#scene');
    if (scene) scene.setAttribute('transform', 'translate(' + state.panX.toFixed(2) + ' ' + state.panY.toFixed(2) + ') scale(' + state.zoom.toFixed(3) + ')');
    var z = $('#zoom-value');
    if (z) z.textContent = Math.round(state.zoom * 100) + '%';
  }

  function positionSnapshot(base, items, key) {
    var saved = state.positions[key] || {};
    var out = {};
    items.forEach(function (it) {
      var id = it.n.id, p = saved[id] || base.pos[id];
      if (p) out[id] = { x: p.x, y: p.y, w: p.w, h: p.h };
    });
    state.positions[key] = out;
    return out;
  }

  function layout(items, edges) {

  function eventPoint(e) {

  function fitToContent() {

    }
    var bounds = r.routeBounds;
    var minX = bounds ? bounds.minX : Infinity, minY = bounds ? bounds.minY : Infinity;
    var maxX = bounds ? bounds.maxX : -Infinity, maxY = bounds ? bounds.maxY : -Infinity;
    if (!bounds) Object.keys(r.positions).forEach(function (id) {
      var p = r.positions[id];
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h);

    state.panX = (vp.w - w * state.zoom) / 2 - minX * state.zoom;
    state.panY = (vp.h - h * state.zoom) / 2 - minY * state.zoom;

  function zoomAt(factor, point) {

  function renderDiagram() {
    var parent = currentParent();
    var key = currentViewKey();
    if (state.viewKey !== key) { state.viewKey = key; state.fitRequested = true; }
    var view = viewItems(parent);
    var items = view.nodes.map(function (n) { return { n: n, ext: false, up: false }; });
    view.ext.forEach(function (n) { items.push({ n: n, ext: true, up: false }); });
    if (view.parentNode) items.push({ n: view.parentNode, ext: true, up: true });
    var L = layout(items, view.edges);
    var vp = viewportSize(), positions = positionSnapshot(L, items, key);
    state.rendered = { key: key, view: view, items: items, layout: L, positions: positions };
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '100%');
    svg.setAttribute('viewBox', '0 0 ' + vp.w + ' ' + vp.h);
    svg.innerHTML = '';
    var defs = document.createElementNS(SVG_NS, 'defs');
    function marker(id, color) {

      m.setAttribute('id', id);
      m.setAttribute('viewBox', '0 0 10 10');
      m.setAttribute('refX', '9');
      m.setAttribute('refY', '5');
      m.setAttribute('markerWidth', '7');
      m.setAttribute('markerHeight', '7');
      m.setAttribute('orient', 'auto-start-reverse');
      var p = document.createElementNS(SVG_NS, 'path');
      p.setAttribute('d', 'M0,0 L10,5 L0,10 z');
      p.setAttribute('fill', color);
      m.appendChild(p);
      return m;
    }
    defs.appendChild(marker('arr', '#8b949e'));
    defs.appendChild(marker('arr-hi', '#58a6ff'));
    svg.appendChild(defs);

    var hit = mk('rect', { x: 0, y: 0, width: vp.w, height: vp.h }, 'canvas-hit-area');
    svg.appendChild(hit);
    var scene = mk('g', {}, 'scene');
    scene.setAttribute('id', 'scene');
    svg.appendChild(scene);

    if (!items.length) {
      var msg = mk('text', { x: MARGIN, y: 60, fill: fg().muted, 'font-size': 13 });
      msg.textContent = '（该视图没有模块数据）';
      scene.appendChild(msg);
      renderBreadcrumb();
      if (state.fitRequested) { fitToContent(); state.fitRequested = false; } else applyTransform();
      return;
    }

    var sel = state.selected;
    var q = state.query.trim().toLowerCase();
    function matches(n) {
      if (!q) return true;
      return (
        n.label + ' ' + (n.summary || '') + ' ' + (n.detail || '') +
        ' ' + (Array.isArray(n.notes) ? n.notes : []).join(' ') +
        ' ' + (Array.isArray(n.evidence) ? n.evidence : []).join(' ')
      ).toLowerCase().indexOf(q) >= 0;
    }
    var dimmed = {};
    items.forEach(function (it) { if (!matches(it.n)) dimmed[it.n.id] = true; });
    var connected = {};
    var reachable = {}, pathEdge = {};
    if (sel) {
      view.edges.forEach(function (e) {
        if (e.from === sel || e.to === sel) { connected[e.from] = true; connected[e.to] = true; }
      });
      connected[sel] = true;
      /* Critical path: continue the focus along directed flow edges toward

         chain receive the strongest emphasis. */

      while (queue.length) {

        reachable[cur] = true;
        view.edges.forEach(function (e) {
          if (e.kind === 'flow' && e.from === cur && !queued[e.to]) { queued[e.to] = true; queue.push(e.to); }
        });
      }
      view.edges.forEach(function (e) {
        if (e.kind === 'flow' && reachable[e.from] && reachable[e.to]) pathEdge[e.from + '\u2192' + e.to] = true;
      });
    }

    var routingBoxes = [], routedSegments = [], occupiedLabels = [];
    var routeBounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    Object.keys(positions).forEach(function (id) {
      var p = positions[id];
      routingBoxes.push(expandedBox(p, 18, id));
      occupiedLabels.push({ x: p.x - 5, y: p.y - 5, w: p.w + 10, h: p.h + 10 });
      routeBounds.minX = Math.min(routeBounds.minX, p.x); routeBounds.minY = Math.min(routeBounds.minY, p.y);
      routeBounds.maxX = Math.max(routeBounds.maxX, p.x + p.w); routeBounds.maxY = Math.max(routeBounds.maxY, p.y + p.h);
    });
    var edgesToRender = view.edges.slice().sort(function (ea, eb) {

      }

      points.forEach(function (p) {
        routeBounds.minX = Math.min(routeBounds.minX, p.x); routeBounds.minY = Math.min(routeBounds.minY, p.y);
        routeBounds.maxX = Math.max(routeBounds.maxX, p.x); routeBounds.maxY = Math.max(routeBounds.maxY, p.y);

      g.setAttribute('data-route', points.map(function (p) { return p.x.toFixed(2) + ',' + p.y.toFixed(2); }).join(';'));
      if (points.routeFailed) g.setAttribute('data-route-failed', 'true');
      if (e.title || e.label) {

        title.textContent = e.title || e.label;

      }
      var hitPath = mk('path', { d: d, fill: 'none' }, 'edge-hit');
      g.appendChild(hitPath);
      var path = mk('path', { d: d, fill: 'none', 'marker-end': 'url(#' + (onPath || hi ? 'arr-hi' : 'arr') + ')' }, 'edge-line');
      g.appendChild(path);
      if (e.label) {
        var lp = labelPosition(points, e.label, occupiedLabels);
        var labelClass = lp.hidden ? 'edge-label-bg colliding' : 'edge-label-bg';
        var bg = mk('rect', { x: lp.box.x, y: lp.box.y, width: lp.box.w, height: lp.box.h, rx: 4 }, labelClass);
        g.appendChild(bg);
        var t = mk('text', { x: lp.x, y: lp.y, 'text-anchor': 'middle' }, lp.hidden ? 'edge-label colliding' : 'edge-label');
        t.textContent = lp.text || e.label;

    items.forEach(function (it) {
      var n = it.n, p = positions[n.id];

  window.addEventListener(POINTER_EVENTS ? 'pointerup' : 'mouseup', endGesture);
  if (POINTER_EVENTS) window.addEventListener('pointercancel', endGesture);
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomAt(e.deltaY > 0 ? 0.9 : 1.1, viewportPoint(e));
  }, { passive: false });
  svg.addEventListener('click', function (e) {
    if (consumeSuppressedClick()) return;
    if (e.target.closest && e.target.closest('.node')) return;
    state.selected = null;
    renderDiagram();
    closePanel();
  });
  document.querySelectorAll('[data-canvas-action]').forEach(function (button) {
    button.addEventListener('click', function () {
      var action = button.getAttribute('data-canvas-action');
      if (action === 'zoom-in') zoomAt(1.18);
      else if (action === 'zoom-out') zoomAt(1 / 1.18);
      else if (action === 'fit') fitToContent();
      else if (action === 'reset') resetLayout();
      else if (action === 'theme') toggleTheme();
    });
  });
  window.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
    if (e.key === 'Escape') { state.selected = null; $('#search').value = ''; state.query = ''; closePanel(); renderDiagram(); }
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomAt(1.18); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomAt(1 / 1.18); }
    else if (e.key === '0') { e.preventDefault(); fitToContent(); }
  });
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resizeTimer = null;
      if ($('#view-diagram').classList.contains('active')) renderDiagram();
    }, 80);
  });
  buildTabs();
  buildLegend();
  renderDiagram();
})();
</script>
</body>
</html>
